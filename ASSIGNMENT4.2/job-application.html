
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 30px 15px;
            color: #263238;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #174ea6;
            margin-bottom: 10px;
        }

        .intro {
            text-align: center;
            color: #607080;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label,
        legend {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select,
        textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #b8c4d1;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: 2px solid #9fc2ff;
            border-color: #174ea6;
        }

        fieldset {
            border: 1px solid #b8c4d1;
            border-radius: 6px;
            padding: 15px;
            margin: 0 0 20px;
        }

        fieldset label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-weight: normal;
            margin: 5px 15px 5px 0;
        }

        fieldset input {
            accent-color: #174ea6;
        }

        textarea {
            resize: vertical;
        }

        input:disabled {
            background: #e5e7eb;
            color: #6b7280;
            cursor: not-allowed;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #174ea6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #103b80;
        }

        .note {
            font-size: 13px;
            color: #607080;
            margin-top: 6px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Job Application Form</h1>
        <p class="intro">
            Please complete the form to apply for a position.
        </p>

        <form action="#" method="post">

            <div class="form-group">
                <label for="fullName">Full Name *</label>
                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address *</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@email.com"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    autocomplete="tel"
                    required
                >
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth *</label>
                <input
                    type="date"
                    id="dob"
                    name="dateOfBirth"
                    required
                >
            </div>

            <div class="form-group">
                <label for="portfolio">Portfolio URL</label>
                <input
                    type="url"
                    id="portfolio"
                    name="portfolio"
                    placeholder="https://yourportfolio.com"
                >
                <p class="note">Enter a complete URL starting with https://</p>
            </div>

            <fieldset>
                <legend>Preferred Shift *</legend>

                <label for="morning">
                    <input
                        type="radio"
                        id="morning"
                        name="preferredShift"
                        value="Morning"
                        required
                    >
                    Morning
                </label>

                <label for="evening">
                    <input
                        type="radio"
                        id="evening"
                        name="preferredShift"
                        value="Evening"
                    >
                    Evening
                </label>

                <label for="night">
                    <input
                        type="radio"
                        id="night"
                        name="preferredShift"
                        value="Night"
                    >
                    Night
                </label>
            </fieldset>

            <fieldset>
                <legend>Skills</legend>

                <label for="html">
                    <input
                        type="checkbox"
                        id="html"
                        name="skills"
                        value="HTML"
                    >
                    HTML
                </label>

                <label for="css">
                    <input
                        type="checkbox"
                        id="css"
                        name="skills"
                        value="CSS"
                    >
                    CSS
                </label>

                <label for="javascript">
                    <input
                        type="checkbox"
                        id="javascript"
                        name="skills"
                        value="JavaScript"
                    >
                    JavaScript
                </label>

                <label for="java">
                    <input
                        type="checkbox"
                        id="java"
                        name="skills"
                        value="Java"
                    >
                    Java
                </label>
            </fieldset>

            <div class="form-group">
                <label for="qualification">Highest Qualification *</label>
                <select
                    id="qualification"
                    name="qualification"
                    required
                >
                    <option value="">-- Select Qualification --</option>
                    <option value="High School">High School</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Diploma">Diploma</option>
                    <option value="Bachelor's Degree">Bachelor's Degree</option>
                    <option value="Master's Degree">Master's Degree</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="coverLetter">Cover Letter</label>
                <textarea
                    id="coverLetter"
                    name="coverLetter"
                    rows="5"
                    placeholder="Tell us why you are suitable for this job..."
                ></textarea>
            </div>

            <div class="form-group">
                <label for="applicationId">Application ID (Disabled)</label>
                <input
                    type="text"
                    id="applicationId"
                    name="applicationId"
                    value="Generated by employer"
                    disabled
                >
                <p class="note">
                    This field is disabled and cannot be edited.
                </p>
            </div>

            <button type="submit">Submit Application</button>

        </form>
    </main>
</body>
</html>
